name: main

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ['tofu', 'tofu-bootstrap', 'tofu-stackgres']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Running checks
        working-directory: ./${{ matrix.directory }}
        run: |
          echo "--- Running Terraform Init in ${{ matrix.directory }} ---"
          terraform init
          echo ""
          echo "--- Running Terraform Validate in ${{ matrix.directory }} ---"
          terraform validate
          echo ""
          echo "--- Running Terraform Format Check in ${{ matrix.directory }} ---"
          terraform fmt -check || (echo "ERROR: Terraform files in ${{ matrix.directory }} need formatting. Run 'terraform fmt' locally and commit changes." && exit 1)
          echo ""
          echo "Format check passed for ${{ matrix.directory }}."

  release:
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.6

      - name: Build artifacts
        run: |
          tar czvf base.tar.gz -C tofu .
          tar czvf bootstrap.tar.gz -C tofu-bootstrap .
          tar czvf helpers.tar.gz -C modules/helpers .
          tar czvf stackgres.tar.gz -C tofu-stackgres .
          cd tofu && zip -r ../base.zip . && cd ..
          cd tofu-bootstrap && zip -r ../bootstrap.zip . && cd ..
          cd modules/helpers && zip -r ../../helpers.zip . && cd ../..
          cd tofu-stackgres && zip -r ../stackgres.zip . && cd ..

      - name: Stable Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            base.tar.gz
            base.zip
            bootstrap.tar.gz
            bootstrap.zip
            helpers.tar.gz
            helpers.zip
            stackgres.tar.gz
            stackgres.zip
          name: Stable

      - name: Dev Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/dev'
        with:
          tag_name: dev
          prerelease: true
          files: |
            base.tar.gz
            base.zip
            bootstrap.tar.gz
            bootstrap.zip
            helpers.tar.gz
            helpers.zip
            stackgres.tar.gz
            stackgres.zip
          name: Development
